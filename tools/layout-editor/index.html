<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>山兔 · 布局调节窗口</title>
    <link rel="stylesheet" href="/__layout/editor.css" />
  </head>
  <body>
    <header>
      <div>
        <strong>山兔 · 布局调节</strong
        ><small>功能基准 0.2.32 · 修改的是布局草稿</small>
      </div>
      <nav>
        <button id="undo" disabled>撤销</button
        ><button id="redo" disabled>重做</button
        ><button id="export">导出JSON</button
        ><label class="button"
          >导入<input id="import" type="file" accept=".json" hidden /></label
        ><button id="save" class="primary">保存到项目</button
        ><a href="/__layout/gallery.html" target="_blank">功能图示</a>
      </nav>
    </header>
    <main>
      <aside>
        <h2>画布与操作</h2>
        <div class="row">
          <button id="mode" class="primary">正在选择布局</button
          ><select id="granularity" aria-label="选择范围">
            <option value="group">整个组件</option>
            <option value="control">单个控件</option>
            <option value="element">任意元素</option>
          </select>
        </div>
        <p>
          先切到“操作页面”打开面板，再切回选择。移动模式拖组件，大小模式拖边角；Shift点击多选/取消。列表支持Ctrl
          / Shift多选；被挡住的组件也能从清单选择。
        </p>
        <label
          >拖拽操作<select id="interaction">
            <option value="move">移动 · 锁定大小</option>
            <option value="resize">大小 · 锁定移动</option>
          </select></label
        >
        <label
          >手机尺寸<select id="viewport">
            <option value="390,844">390 × 844</option>
            <option value="360,780">360 × 780</option>
            <option value="266,575">266 × 575</option>
            <option value="768,1024">768 × 1024</option>
          </select></label
        ><label
          >预览缩放<input
            id="zoom"
            type="range"
            min="40"
            max="250"
            value="80"
          /><output id="zoom-value">80%</output></label
        >
        <div class="row zoom-actions">
          <input
            id="zoom-number"
            type="number"
            min="40"
            max="250"
            step="10"
            value="80"
            aria-label="预览缩放百分比"
          />
          <button data-zoom="100">100%</button
          ><button data-zoom="200">200%</button>
        </div>
        <label
          ><input
            id="show-outline"
            type="checkbox"
            checked
          />显示细选框（按住空格临时隐藏）</label
        >
        <label><input id="show-label" type="checkbox" />显示选框名称</label>
        <label
          ><input id="guides" type="checkbox" checked />对齐辅助线与吸附</label
        >
        <label
          ><input id="snap" type="checkbox" checked />拖动吸附到4px网格</label
        ><label
          ><input
            id="ratio"
            type="checkbox"
            checked
          />整体缩放（文字、图标一起变化）</label
        >
        <h2>组件与控件清单</h2>
        <label
          >搜索名称<input
            id="search"
            type="search"
            placeholder="定位、海拔、保存…"
        /></label>
        <select
          id="widgets"
          size="10"
          multiple
          aria-label="组件列表，可多选"
        ></select
        ><button id="refresh">刷新组件列表</button>
      </aside>
      <section class="workspace" aria-label="布局预览画布">
        <div id="phone">
          <div id="stage">
            <iframe id="preview" title="山兔真实界面预览" src="/"></iframe>
            <div id="cover" tabindex="0" aria-label="选择或拖动布局控件">
              <div id="member-outlines" aria-hidden="true" hidden></div>
              <div id="outline" hidden>
                <button id="move-selection" aria-label="拖动选中组件">
                  <span id="outline-label"></span> · 拖动
                </button>
                <button
                  class="resize-handle"
                  data-resize="nw"
                  aria-label="调整左上角"
                ></button>
                <button
                  class="resize-handle"
                  data-resize="n"
                  aria-label="调整上边"
                ></button>
                <button
                  class="resize-handle"
                  data-resize="ne"
                  aria-label="调整右上角"
                ></button>
                <button
                  class="resize-handle"
                  data-resize="e"
                  aria-label="调整右边"
                ></button>
                <button
                  class="resize-handle"
                  data-resize="se"
                  aria-label="调整右下角"
                ></button>
                <button
                  class="resize-handle"
                  data-resize="s"
                  aria-label="调整下边"
                ></button>
                <button
                  class="resize-handle"
                  data-resize="sw"
                  aria-label="调整左下角"
                ></button>
                <button
                  class="resize-handle"
                  data-resize="w"
                  aria-label="调整左边"
                ></button>
              </div>
            </div>
          </div>
        </div>
      </section>
      <aside>
        <h2 id="selected-name">选择一个组件</h2>
        <p id="selected-description">点击手机预览中的UI，或从左侧列表选择。</p>
        <fieldset id="properties" disabled>
          <label
            >外框 / 内容<select id="hierarchy" aria-label="组件层级"></select
          ></label>
          <button id="select-parent" disabled>选外层</button>
          <label
            ><span id="dx-label">水平偏移 px</span
            ><input
              id="dx"
              type="number"
              min="-3000"
              max="3000"
              step="1" /></label
          ><label
            ><span id="dy-label">垂直偏移 px</span
            ><input id="dy" type="number" min="-3000" max="3000" step="1"
          /></label>
          <div class="row">
            <label
              >宽 px<input
                id="width"
                type="number"
                min="16"
                max="2000"
                placeholder="自动" /></label
            ><label
              >高 px<input
                id="height"
                type="number"
                min="16"
                max="2000"
                placeholder="自动"
            /></label>
          </div>
          <label
            ><span id="scale-label">整体比例</span
            ><input
              id="scale"
              type="number"
              min="0.4"
              max="2.5"
              step="0.05" /></label
          ><label
            >显示字号 px<input
              id="fontSize"
              type="number"
              min="0.1"
              max="200"
              step="0.1"
              title="首处文字的显示字号px；修改统一所选文字，清空恢复默认" /></label
          ><label
            >显示层级<input
              id="zIndex"
              type="number"
              min="-1000"
              max="99999"
              placeholder="沿用原层级"
          /></label>
          <div class="row">
            <button id="raise">上一层</button><button id="lower">下一层</button
            ><button data-align="recover">移回画面</button>
          </div>
          <div class="row align-actions">
            <button data-align="left">靠左</button
            ><button data-align="center">居中</button
            ><button data-align="right">靠右</button>
            <button data-align="top">靠上</button
            ><button data-align="bottom">靠下</button>
          </div>
          <p>层级用于同一父组件内的遮挡；整体被挡时选择外层组件调整。</p>
          <label><input id="hidden" type="checkbox" />隐藏此组件</label
          ><button id="reset">恢复此组件默认布局</button>
        </fieldset>
        <h2>已修改</h2>
        <select id="changes" size="8" aria-label="已修改组件"></select>
        <p>
          偏移相对原布局。空宽高保留自适应；保存记录当前画布尺寸。后续统一对齐时以这份草稿为准。
        </p>
        <p id="status" role="status">正在载入…</p>
      </aside>
    </main>
    <script type="module" src="/__layout/editor.mjs"></script>
  </body>
</html>
