<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14221c"><title>户外模拟定位预览 · 非真机</title><style>
:root{font:15px/1.4 system-ui,"Microsoft YaHei",sans-serif;color:#edf5ef;background:#14221c}*{box-sizing:border-box}body{margin:0;min-height:100vh}.shell{min-height:100vh;display:grid;grid-template-columns:minmax(285px,340px) minmax(390px,1fr);gap:16px;padding:12px;justify-content:center}.console{border:1px solid #486451;border-radius:10px;background:#1d3025;padding:14px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 24px);overflow:auto}.badge{background:#ffc94f;color:#251b00;font-weight:800;text-align:center;padding:11px;border-radius:6px;font-size:17px}.state{background:#102019;border-radius:6px;padding:10px;line-height:1.7;font-variant-numeric:tabular-nums}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0;flex:1}label{display:grid;gap:3px;font-size:13px;color:#c5d7ca}input,select,button{font:inherit;min-height:42px;border-radius:5px;border:1px solid #547060;padding:7px;background:#102019;color:#f2f7f3}button{font-weight:700;cursor:pointer}button:active{background:#365a42}button.primary{background:#c8f17e;color:#17230f;border-color:#c8f17e}button.warn{color:#fff0cd;border-color:#a97832}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px}.compass{display:grid;grid-template-columns:repeat(3,54px);justify-content:center;gap:4px}.compass button{min-height:48px;font-size:18px}.compass .up{grid-column:2}.compass .left{grid-column:1;grid-row:2}.compass .down{grid-column:2;grid-row:2}.compass .right{grid-column:3;grid-row:2}.compass .center{grid-column:2;grid-row:3}.framewrap{display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0}.framehead{width:min(100%,460px);display:flex;gap:8px;align-items:center;justify-content:space-between;color:#d1e0d5}.phone{position:relative;flex:none;width:404px;height:871px;border:7px solid #354c3b;border-radius:24px;overflow:hidden;box-shadow:0 12px 40px #0008;background:#ddd}iframe{position:absolute;left:0;top:0;width:390px;height:857px;border:0;background:#fff;transform-origin:top left}.hint{font-size:12px;color:#b6cbbd}.collapsed{display:none}.collapsedbar{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:3}.bottomMode{grid-template-columns:1fr}.bottomMode .console{position:fixed;z-index:4;left:8px;right:8px;bottom:8px;max-height:48vh}.bottomMode .console.collapsed{display:none}.bottomMode .framewrap{grid-column:1}@media(max-width:800px){.shell{grid-template-columns:minmax(0,1fr);padding:8px}.framewrap{grid-row:1}.console{position:fixed;z-index:4;left:8px;right:8px;top:54px;bottom:8px;max-height:none;box-shadow:0 12px 42px #000b}.console.collapsed{display:none}.framehead{max-width:460px}.framehead #collapse{display:none}}
</style></head><body><main id="shell" class="shell"><section id="console" class="console"><div class="badge">模拟定位 · 非真实GPS</div><div id="state" class="state" aria-live="polite">状态：等待 iframe 连接<br>坐标：—<br>速度 / 方向 / 精度：—</div><div class="row"><button id="start" class="primary">开始</button><button id="pause">暂停</button><button id="reset">重置</button></div><div class="row"><label>速度模式<select id="mode"><option value="walk">步行 1.4 m/s</option><option value="run">跑步 3 m/s</option><option value="cycle">骑行 6 m/s</option><option value="custom">任意速度</option></select></label><label>速度 (m/s)<input id="speed" type="number" min="0" max="30" step="0.1" value="1.4"></label></div><div class="row"><label>起点经度<input id="lng" type="number" min="-180" max="180" step="0.000001" value="104.0660"></label><label>起点纬度<input id="lat" type="number" min="-90" max="90" step="0.000001" value="30.6590"></label></div><div class="row"><button id="setStart">设置起点</button><label>精度 (m)<input id="accuracy" type="number" min="0" max="1000" value="5"></label></div><label>方向 (0–359°)<input id="heading" type="number" min="0" max="359" step="1" value="0"></label><div class="row"><button id="turnLeft">左转 15°</button><button id="turnRight">右转 15°</button></div><div class="compass"><button class="up" data-dir="0">↑ N</button><button class="left" data-dir="270">← W</button><button class="down" data-dir="180">↓ S</button><button class="right" data-dir="90">→ E</button><button class="center" id="step">移动 5 m</button></div><div class="controls"><button id="loopStart" class="primary">播放环形路线</button><button id="outback">播放往返路线</button><button id="lost" class="warn">模拟 GPS 超时</button><button id="restore">恢复模拟定位</button></div><div class="hint">路线按所选 m/s 连续推进；暂停会保持最新位置并停止距离增长。方向和位置均为合成数据，模拟存档与正常预览隔离。点击地图设点暂未启用，请用经纬度输入设置起点。</div></section><section class="framewrap"><div class="framehead"><span>手机地图预览 · 390 × 857 · 非真机</span><button id="collapse">收起控制台</button><button id="showTop">模拟控制</button></div><div class="phone"><iframe id="map" title="模拟定位地图预览 · 非真机" allow="fullscreen 'none'"></iframe></div></section></main><button id="show" class="collapsedbar collapsed">展开模拟定位控制台</button><script type="module" src="/outdoor-simulator.js"></script></body></html>
