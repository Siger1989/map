<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>山兔 · 手机预览 390×844</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202622}body{display:grid;place-items:center}#phone{position:relative;flex:none;box-shadow:0 0 0 1px #536459}iframe{position:absolute;left:0;top:0;border:0;width:390px;height:844px;transform-origin:top left;background:white}</style></head>
<body><div id="phone"><iframe title="山兔手机预览 · 390×844"></iframe></div>
<script>
const phone=document.querySelector('#phone'),frame=document.querySelector('iframe');
function fit(){const scale=Math.min(1,Math.max(1,innerWidth-16)/390,Math.max(1,innerHeight-16)/844);phone.style.width=390*scale+'px';phone.style.height=844*scale+'px';frame.style.transform='scale('+scale+')'}
frame.src='/'+location.hash;
frame.addEventListener('load',()=>{const sync=()=>history.replaceState(null,'',location.pathname+frame.contentWindow.location.hash);frame.contentWindow.addEventListener('hashchange',sync);sync()});
addEventListener('resize',fit);fit();
</script></body></html>
