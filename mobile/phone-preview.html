<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>山兔 · 网页调色预览</title>
<link rel="stylesheet" href="./phonePreviewKeyboard.css">
<link rel="stylesheet" href="./phonePreviewMaterial.css">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202622}body{display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}#preview-stage{grid-column:2;grid-row:1;display:grid;place-items:center;min-width:0;min-height:0;overflow:hidden}#phone{position:relative;flex:none;overflow:hidden;box-shadow:0 0 0 1px #536459;background:#10212b}iframe{position:absolute;left:0;top:0;border:0;transform-origin:top left;background:white}@media(max-width:700px){body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}#preview-stage{grid-column:1;grid-row:2}}</style></head>
<body><section id="preview-material" aria-label="预览背景透明度"></section><main id="preview-stage"><div id="phone"><iframe allow="fullscreen 'none'" title="山兔手机预览 · OPPO Find X8 Ultra · 网页比例预览"></iframe></div></main>
<script type="module">
import { installPhonePreviewKeyboard } from './phonePreviewKeyboard.js';
import { installPhonePreviewMaterial } from './phonePreviewMaterial.js';
const phone=document.querySelector('#phone'),frame=document.querySelector('iframe');
// Keep the right-side preview fixed by default; named sizes are for separate QA tabs.
// Pura X presets reproduce the official 1320:2120 inner-screen shape.
// CSS density is illustrative; HarmonyOS display settings/container may differ.
const checks={'360x780':[360,780],'390x480':[390,480],'360x360':[360,360],
  'find-x8-landscape':[390*2760/1256,390],
  'pura-x':[440,440*2120/1320],'pura-x-landscape':[440*2120/1320,440]};
const requested=new URLSearchParams(location.search).get('viewport');
const check=Object.hasOwn(checks,requested)?checks[requested]:null;
// Find X8 Ultra: 1440 × 3168. Reserve the system area seen in the user's
// 1164×2560 portrait capture (129 px above the app, no bottom system bar).
const [width,screenHeight]=check||[390,390*3168/1440];
const statusBarHeight=check?0:width*129/1164;
const height=screenHeight-statusBarHeight;
if(check){
  const fold=requested.startsWith('pura-x');
  document.title=fold?'山兔 · 华为阔屏比例预览':requested==='find-x8-landscape'?'山兔 · OPPO Find X8 横屏预览':'山兔 · 独立适配检查';
  frame.title=fold?'山兔华为阔屏比例模拟 · '+(requested.endsWith('landscape')?'横屏':'竖屏')+' · 非真机':requested==='find-x8-landscape'?'山兔 OPPO Find X8 横屏比例模拟 · 非真机':'山兔独立适配检查 · '+requested;
}
frame.style.width=width+'px';frame.style.height=height+'px';
let keyboard,material;
function fit(){const stage=document.querySelector('#preview-stage').getBoundingClientRect();const availableWidth=Math.max(1,stage.width-16),availableHeight=Math.max(1,stage.height-16);const scale=Math.min(1,availableWidth/width,availableHeight/screenHeight);phone.style.width=width*scale+'px';phone.style.height=screenHeight*scale+'px';frame.style.top=statusBarHeight*scale+'px';frame.style.transform='scale('+scale+')';keyboard?.setScale(scale)}
const scene=new URLSearchParams(location.search).get('scene');
const skyPreview=scene==='sky'||scene==='journey'||scene==='marker';
if(skyPreview) {
  document.title=scene==='journey'?'山兔 · 第三人称行程模拟':scene==='marker'?'山兔 · 标记点观景':'山兔 · 青城山日月观景';
  document.querySelector('#preview-material').hidden=true;
  document.body.style.display='block';
  document.querySelector('#preview-stage').style.height='100%';
}
const journeyPage=new URLSearchParams(location.search).get('route')==='road'?'/journey-preview.html?route=road':'/journey-preview.html';
frame.src=(skyPreview?(scene==='journey'?journeyPage:scene==='marker'?'/sky-preview.html?marker=1':'/sky-preview.html'):'/')+location.hash;
frame.addEventListener('load',()=>{const sync=()=>history.replaceState(null,'',location.pathname+location.search+frame.contentWindow.location.hash);frame.contentWindow.addEventListener('hashchange',sync);sync()});
keyboard=installPhonePreviewKeyboard({phone,frame,width,height});
if(!skyPreview)material=installPhonePreviewMaterial({frame,onLayoutChange:fit});
addEventListener('resize',fit);fit();
</script></body></html>
