<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>山兔 · OPPO Find X8 预览</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202622}body{display:grid;place-items:center}#phone{position:relative;flex:none;box-shadow:0 0 0 1px #536459}iframe{position:absolute;left:0;top:0;border:0;transform-origin:top left;background:white}</style></head>
<body><div id="phone"><iframe allowfullscreen title="山兔手机预览 · OPPO Find X8 · 1256∶2760"></iframe></div>
<script>
const phone=document.querySelector('#phone'),frame=document.querySelector('iframe');
// Keep the right-side preview fixed by default; named sizes are for separate QA tabs.
// Pura X presets reproduce the official 1320:2120 inner-screen shape.
// CSS density is illustrative; HarmonyOS display settings/container may differ.
const checks={'360x780':[360,780],'390x480':[390,480],'360x360':[360,360],
  'find-x8-landscape':[390*2760/1256,390],
  'pura-x':[440,440*2120/1320],'pura-x-landscape':[440*2120/1320,440]};
const requested=new URLSearchParams(location.search).get('viewport');
const check=Object.hasOwn(checks,requested)?checks[requested]:null;
const [width,height]=check||[390,390*2760/1256];
if(check){
  const fold=requested.startsWith('pura-x');
  document.title=fold?'山兔 · 华为阔屏比例预览':requested==='find-x8-landscape'?'山兔 · OPPO Find X8 横屏预览':'山兔 · 独立适配检查';
  frame.title=fold?'山兔华为阔屏比例模拟 · '+(requested.endsWith('landscape')?'横屏':'竖屏')+' · 非真机':requested==='find-x8-landscape'?'山兔 OPPO Find X8 横屏比例模拟 · 非真机':'山兔独立适配检查 · '+requested;
}
frame.style.width=width+'px';frame.style.height=height+'px';
function fit(){const scale=Math.min(1,Math.max(1,innerWidth-16)/width,Math.max(1,innerHeight-16)/height);phone.style.width=width*scale+'px';phone.style.height=height*scale+'px';frame.style.transform='scale('+scale+')'}
frame.src='/'+location.hash;
frame.addEventListener('load',()=>{const sync=()=>history.replaceState(null,'',location.pathname+location.search+frame.contentWindow.location.hash);frame.contentWindow.addEventListener('hashchange',sync);sync()});
addEventListener('resize',fit);fit();
</script></body></html>
